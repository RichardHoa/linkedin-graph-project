<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphRAG Chat</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica;
        background: #212121;
        color: #ececf1;
        margin: 0;
        display: flex;
        height: 100vh;
      }
      #sidebar {
        width: 260px;
        background: #000;
        padding: 15px;
        display: flex;
        flex-direction: column;
      }
      #chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 0;
      }
      .message {
        padding: 25px;
        display: flex;
        gap: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .user {
        background: #212121;
      }
      .assistant {
        background: #444654;
      }
      .content {
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.6;
      }
      .input-area {
        padding: 40px 20px;
        background: linear-gradient(transparent, #212121 50%);
      }
      .input-wrapper {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
      }
      textarea {
        width: 100%;
        background: #40414f;
        color: white;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 12px;
        font-size: 16px;
        resize: none;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }
      button {
        position: absolute;
        right: 10px;
        bottom: 15px;
        background: #19c37d;
        border: none;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="sidebar"><strong>Graph Project</strong></div>
    <div id="chat-container">
      <div id="messages"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Ask about career paths..."
          ></textarea>
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <script>
      let history = [];
      let isFurtherQuestion = false;

      async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text) return;

        appendMessage("user", text);
        input.value = "";

        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: text,
            history: history,
            furtherQuestion: isFurtherQuestion,
          }),
        });

        const data = await response.json();
        const aiText = data.analysis || data.question;

        appendMessage("assistant", aiText);
        history.push({ role: "user", text: text });
        history.push({ role: "assistant", text: aiText });

        if (data.isFinal) {
          isFurtherQuestion = true;
        }
      }

      function appendMessage(role, text) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.innerHTML = `<div class="content"><strong>${
          role === "user" ? "You" : "AI"
        }:</strong><br>${text.replace(/\n/g, "<br>")}</div>`;
        document.getElementById("messages").appendChild(div);
        div.scrollIntoView();
      }
    </script>
  </body>
</html>
